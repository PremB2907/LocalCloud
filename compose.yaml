services:
  floci:
    image: floci/floci:2.2.0@sha256:e97cd0c1dc2aa14e7697fb5ef5018404c4d6345169dbd276315f0bed2c7b0520
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      # Required for Floci EC2 (Docker-backed instances) and Lambda (container execution).
      # Linux / WSL2 backend:
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker Desktop on Windows/macOS also exposes /var/run/docker.sock to Linux
      # containers, so no extra mapping is needed there.